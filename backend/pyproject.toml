[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "soniccraft-dsp"
version = "0.1.0"
description = "Reusable digital signal processing utilities for SonicCraft"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "soundfile>=0.12,<1",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
desktop = ["PyQt6>=6.8,<7", "pyqtgraph>=0.13.7,<0.15", "sounddevice>=0.5,<0.6"]
dev = ["pytest>=8,<10"]

[project.gui-scripts]
soniccraft = "soniccraft.desktop.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
